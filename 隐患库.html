<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隐患库</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"><style>body{font-family:Inter,"Microsoft YaHei",sans-serif;background:#f5f7fb;color:#243247}.panel{background:#fff;border:1px solid #e1e8f0;border-radius:12px}.tree button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:7px;color:#60728b}.tree button.active,.tree button:hover{background:#eff6ff;color:#2563eb}.btn{border:1px solid #d7e1ed;background:#fff;border-radius:7px;padding:8px 13px;font-size:13px;cursor:pointer}.link{color:#2563eb;cursor:pointer;margin-right:14px}.status{padding:4px 9px;border-radius:99px;font-size:12px}.ok{background:#e8f8f0;color:#07945b}.warn{background:#fff4df;color:#d98200}.hint{background:#fff8e8;border:1px solid #f5d58c;color:#8b5a00;border-radius:9px;padding:12px 15px;font-size:13px}.modal-mask{position:fixed;inset:0;background:#0f172a66;display:none;align-items:center;justify-content:center;z-index:30}.modal-mask.open{display:flex}.modal{width:min(900px,92vw);max-height:86vh;overflow:auto;background:#fff;border-radius:14px}</style></head><body><div class="flex h-screen"><aside></aside><div class="flex-1 ml-[240px] overflow-auto"><header class="h-14 bg-white border-b border-slate-200 flex items-center px-6"><div><div class="text-xs text-slate-400">数据管理 / 隐患库</div><h1 class="text-lg font-semibold">隐患库</h1></div></header><main class="p-6"><div class="flex gap-5 items-start"><aside class="panel w-56 p-4 shrink-0"><h2 class="font-semibold mb-4">隐患分类</h2><div class="tree"><button class="active" data-cat="全部">全部隐患 <span class="float-right text-xs">12</span></button><button data-cat="安全生产">安全生产 <span class="float-right text-xs">5</span></button><button data-cat="人员行为">人员行为 <span class="float-right text-xs">3</span></button><button data-cat="环境设施">环境设施 <span class="float-right text-xs">4</span></button></div></aside><div class="flex-1 min-w-0"><div class="panel p-4 mb-4 flex flex-wrap gap-3"><select id="level" class="btn"><option>全部等级</option><option>重大</option><option>较大</option><option>一般</option></select><select id="state" class="btn"><option>全部状态</option><option>待审核</option><option>已审核</option></select><input id="search" class="btn w-64" placeholder="搜索隐患编号或描述"></div><div class="hint mb-4"><i class="fa fa-lightbulb-o mr-2"></i>当前隐患库有 <b>860</b> 张有效未训练图片，训练最低张数为 <b id="threshold">1,000</b> 张；达到阈值后，可导入训练数据集进行训练。</div><section class="panel overflow-hidden"><div class="px-5 py-4 border-b"><h2 class="font-semibold">隐患列表</h2><p class="text-xs text-slate-400 mt-1">内部隐患记录及关联照片统一管理</p></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-slate-500"><tr><th class="p-4 text-left">隐患编号</th><th class="text-left">隐患描述</th><th>隐患分类</th><th>隐患等级</th><th>关联隐患数</th><th>图片数</th><th>已导入数据集</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></div></main></div></div><div id="mask" class="modal-mask"><div class="modal"><div class="p-5 border-b flex justify-between"><h2 id="title" class="font-semibold"></h2><button id="close" class="text-2xl text-slate-400">×</button></div><div id="body" class="p-5"></div></div></div><script>
const data=[['YH-202608-001','未佩戴安全帽','人员行为','一般',4,8,2,'已审核'],['YH-202608-002','危险区域入侵','安全生产','较大',3,6,1,'已审核'],['YH-202608-003','临边防护缺失','安全生产','一般',2,5,0,'待审核'],['YH-202608-004','消防通道堵塞','环境设施','重大',5,12,2,'已审核'],['YH-202608-005','设备防护罩缺失','安全生产','一般',1,3,0,'待审核'],['YH-202608-006','照明不足','环境设施','一般',2,4,0,'已审核']];let cat='全部',q=s=>document.querySelector(s);function render(){const s=q('#search').value.toLowerCase(),l=q('#level').value,st=q('#state').value,list=data.filter(r=>(cat==='全部'||r[2]===cat)&&(l==='全部等级'||r[3]===l)&&(st==='全部状态'||r[7]===st)&&(r[0]+r[1]).toLowerCase().includes(s));q('#rows').innerHTML=list.map(r=>`<tr class="border-t hover:bg-slate-50"><td class="p-4 text-primary font-medium">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="status ${r[3]==='重大'?'warn':'ok'}">${r[3]}</span></td><td class="text-center"><button class="link" data-rel="${r[0]}">${r[4]}</button></td><td class="text-center"><button class="link" data-photo="${r[0]}">${r[5]}</button></td><td class="text-center">${r[6]}</td><td class="text-center"><span class="status ${r[7]==='已审核'?'ok':'warn'}">${r[7]}</span></td><td><span class="link" data-view="${r[0]}">查看详情</span></td></tr>`).join('');document.querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>location.href='隐患违章管理-隐患查处.html?hazardIds='+b.dataset.rel);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(data.find(r=>r[0]===b.dataset.view),false));document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>show(data.find(r=>r[0]===b.dataset.photo),true))}function show(r,photos){q('#title').textContent=r[0]+' · '+r[1];q('#body').innerHTML=photos?`<h3 class="font-semibold mb-3">关联照片（${r[5]} 张）</h3><div class="grid grid-cols-4 gap-3">${Array.from({length:r[5]},(_,i)=>`<div class="border rounded p-2"><div class="h-20 bg-slate-100 flex items-center justify-center"><i class="fa fa-image text-2xl text-slate-300"></i></div><div class="text-xs mt-2">${r[0]}-${i+1}</div></div>`).join('')}</div>`:`<div class="grid grid-cols-2 gap-4 text-sm"><div>隐患分类：${r[2]}</div><div>隐患等级：${r[3]}</div><div>关联隐患台账：<b>${r[4]} 条</b></div><div>关联图片：<b>${r[5]} 张</b></div><div>已导入数据集：<b>${r[6]} 个</b></div><div>状态：${r[7]}</div></div>`;q('#mask').classList.add('open')}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});q('#search').oninput=render;q('#level').onchange=render;q('#state').onchange=render;q('#close').onclick=()=>q('#mask').classList.remove('open');render();</script><script src="navigation.js?v=20260819-2"></script></body></html>
