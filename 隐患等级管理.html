<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>隐患等级管理</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#1677ff',line:'#E5E7EB',muted:'#64748B'}}}}</script>
</head>
<body class="h-screen overflow-hidden bg-slate-50 text-slate-800 flex">
  <aside></aside>
  <main class="flex-1 min-w-0 flex flex-col overflow-hidden">
    <header class="h-16 bg-white border-b border-line px-6 flex items-center justify-between shrink-0"><div><i class="fa fa-bars text-muted mr-4"></i><span class="font-medium">基础管理 / 隐患等级管理</span></div><div class="text-sm"><i class="fa fa-user-circle text-primary mr-2"></i>安全管理员</div></header>
    <section class="flex-1 overflow-auto p-6">
      <div class="bg-blue-50 border border-blue-200 rounded p-3 text-sm text-blue-700 mb-5"><i class="fa fa-info-circle mr-2"></i>隐患等级用于定义风险程度、整改时限和管控要求，为隐患排查治理及闭环处置提供统一标准。</div>
      <div class="bg-white border border-line rounded p-4 mb-4 flex items-center gap-4"><input id="search" class="w-64 border border-line rounded px-3 py-2 text-sm" placeholder="请输入隐患等级名称"><label class="text-sm text-muted">状态：</label><select id="statusFilter" class="border border-line rounded px-3 py-2 text-sm"><option>全部</option><option>启用</option><option>停用</option></select></div>
      <div class="bg-white border border-line rounded overflow-hidden"><div class="px-4 py-3 border-b border-line flex items-center justify-between"><span class="font-medium">隐患等级列表</span><button id="add" class="bg-primary text-white px-4 py-2 rounded text-sm"><i class="fa fa-plus mr-1"></i>新增隐患等级</button></div><table class="w-full text-sm"><thead class="bg-slate-50 text-muted"><tr><th class="p-3 text-left">序号</th><th class="p-3 text-left">等级名称</th><th class="p-3 text-left">等级编码</th><th class="p-3 text-left">标识颜色</th><th class="p-3 text-left">整改时限</th><th class="p-3 text-left">管控要求</th><th class="p-3 text-left">状态</th><th class="p-3 text-left">操作</th></tr></thead><tbody id="levelRows"></tbody></table></div>
    </section>
  </main>
  <div id="modal" class="hidden fixed inset-0 z-[80] bg-black/40 items-center justify-center p-5"><form id="form" class="w-[560px] max-w-[95vw] bg-white rounded-xl shadow-2xl"><header class="px-5 py-4 border-b flex justify-between"><h2 id="title" class="font-semibold"></h2><button type="button" data-close><i class="fa fa-times"></i></button></header><div class="p-5 grid grid-cols-2 gap-4"><label class="text-sm">等级名称 <b class="text-red-500">*</b><input id="levelName" required class="mt-2 w-full border border-line rounded px-3 py-2"></label><label class="text-sm">等级编码 <b class="text-red-500">*</b><input id="levelCode" required class="mt-2 w-full border border-line rounded px-3 py-2"></label><label class="text-sm">标识颜色<input id="levelColor" type="color" value="#ef4444" class="mt-2 w-full h-10 border border-line rounded px-2"></label><label class="text-sm">整改时限<input id="deadline" class="mt-2 w-full border border-line rounded px-3 py-2" placeholder="如：24小时内"></label><label class="text-sm col-span-2">管控要求<textarea id="requirement" rows="3" class="mt-2 w-full border border-line rounded px-3 py-2"></textarea></label></div><footer class="px-5 py-4 border-t flex justify-end gap-3"><button type="button" data-close class="border border-line px-5 py-2 rounded">取消</button><button class="bg-primary text-white px-5 py-2 rounded">确认</button></footer></form></div>
  <script>
    const levels=[{name:'重大隐患',code:'H1',color:'#ef4444',time:'立即整改',req:'立即停产停业，制定专项治理方案并挂牌督办',status:'启用'},{name:'较大隐患',code:'H2',color:'#f97316',time:'24小时内',req:'落实专项管控措施，限期完成整改',status:'启用'},{name:'一般隐患',code:'H3',color:'#eab308',time:'7日内',req:'明确责任人和整改期限，按期闭环',status:'启用'},{name:'低风险隐患',code:'H4',color:'#22c55e',time:'30日内',req:'纳入日常管理，持续跟踪整改',status:'启用'}];const tbody=document.getElementById('levelRows');let edit=-1;
    function render(){const q=document.getElementById('search').value.trim(),s=document.getElementById('statusFilter').value;tbody.innerHTML=levels.map((x,i)=>({x,i})).filter(({x})=>(!q||x.name.includes(q))&&(s==='全部'||x.status===s)).map(({x,i})=>`<tr class="border-t border-line hover:bg-slate-50"><td class="p-3">${i+1}</td><td class="p-3 font-medium">${x.name}</td><td class="p-3">${x.code}</td><td class="p-3"><span class="inline-block w-4 h-4 rounded-full align-middle mr-2" style="background:${x.color}"></span>${x.color}</td><td class="p-3">${x.time}</td><td class="p-3 max-w-sm">${x.req}</td><td class="p-3"><button class="status text-green-600" data-i="${i}">${x.status}</button></td><td class="p-3"><button class="edit text-primary mr-4" data-i="${i}">编辑</button><button class="delete text-red-500" data-i="${i}">删除</button></td></tr>`).join('');bind()}
    function open(i=-1){edit=i;document.getElementById('title').textContent=i<0?'新增隐患等级':'编辑隐患等级';const x=levels[i]||{};document.getElementById('levelName').value=x.name||'';document.getElementById('levelCode').value=x.code||'';document.getElementById('levelColor').value=x.color||'#ef4444';document.getElementById('deadline').value=x.time||'';document.getElementById('requirement').value=x.req||'';document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex')}
    function close(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').classList.remove('flex')}function bind(){document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>open(+b.dataset.i));document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{levels.splice(+b.dataset.i,1);render()});document.querySelectorAll('.status').forEach(b=>b.onclick=()=>{const x=levels[+b.dataset.i];x.status=x.status==='启用'?'停用':'启用';render()})}
    document.getElementById('add').onclick=()=>open();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);document.getElementById('form').onsubmit=e=>{e.preventDefault();const x={name:levelName.value.trim(),code:levelCode.value.trim(),color:levelColor.value,time:deadline.value||'待设置',req:requirement.value||'暂无',status:edit<0?'启用':levels[edit].status};edit<0?levels.push(x):levels[edit]=x;close();render()};search.oninput=render;statusFilter.onchange=render;render();
  </script>
  <script src="navigation.js?v=20260819-2"></script>
</body></html>
