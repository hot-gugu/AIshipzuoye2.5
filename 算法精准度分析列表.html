<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI智能分析 / 算法精准度分析</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#2563EB',pageBg:'#F8FAFC',borderLine:'#E2E8F0',textMain:'#1E293B',textSub:'#64748B',textLight:'#94A3B8'}}}};</script>
  <style type="text/tailwindcss">@layer utilities{.scrollbar-thin::-webkit-scrollbar{width:4px}.scrollbar-thin::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}.table-row:hover{background:#F8FAFC}}</style>
</head>
<body class="bg-pageBg h-screen overflow-hidden text-textMain">
<div class="flex h-full"><aside></aside><div class="flex flex-col overflow-hidden w-[calc(100%-240px)] ml-[240px]">
  <header class="h-14 bg-white border-b border-borderLine flex items-center justify-between px-5 shrink-0">
    <div class="flex items-center gap-4"><button class="text-textSub"><i class="fa fa-bars"></i></button><div class="text-sm"><span class="text-textSub">AI智能分析</span><span class="mx-2 text-textLight">/</span><span class="font-medium">算法精准度分析</span></div></div>
    <div class="flex items-center gap-5"><button class="relative text-textSub"><i class="fa fa-bell-o text-lg"></i><span class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">11</span></button><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center text-sm">张</div><div class="text-sm"><div class="font-medium">张安全</div><div class="text-[11px] text-textSub">安全环保部·管理员</div></div></div></div>
  </header>
  <main class="flex-1 overflow-y-auto scrollbar-thin p-5">
    <section class="bg-white border border-borderLine rounded-xl p-5 mb-4 flex items-center justify-between">
      <div><h1 class="text-lg font-semibold">算法综合列表</h1><p class="text-xs text-textSub mt-1.5">汇总当前使用的算法及其最新版本，精准度为各单位最新有效精准度的简单平均值。</p></div>
      <div class="min-w-[190px] rounded-xl bg-blue-50 border border-blue-100 px-5 py-4 flex items-center gap-4"><div class="w-11 h-11 rounded-lg bg-primary text-white flex items-center justify-center"><i class="fa fa-cubes text-lg"></i></div><div><div class="text-xs text-textSub">算法总数</div><div class="text-2xl font-bold mt-0.5"><span id="algorithmCount">0</span><span class="text-sm font-normal text-textSub ml-1">种</span></div></div></div>
    </section>
    <section class="bg-white border border-borderLine rounded-xl overflow-hidden">
      <div class="px-5 py-4 border-b border-borderLine flex justify-between items-center"><div><span class="font-medium text-sm">算法列表</span><span id="listCount" class="text-xs text-textSub ml-2"></span></div><div class="flex items-center gap-3"><div class="text-xs text-textSub"><i class="fa fa-info-circle mr-1 text-primary"></i>综合精准度保留两位小数</div><button id="importAlgorithmButton" class="px-3 py-1.5 rounded-md bg-primary text-white text-xs hover:opacity-90"><i class="fa fa-upload mr-1"></i>导入</button><input id="algorithmImportInput" type="file" accept=".xlsx,.xls,.csv" class="hidden"></div></div>
      <div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50 text-textSub"><tr><th class="px-5 py-3 text-center font-medium w-16">序号</th><th class="px-5 py-3 text-left font-medium">算法名称</th><th class="px-5 py-3 text-left font-medium">算法类型</th><th class="px-5 py-3 text-center font-medium">当前版本</th><th class="px-5 py-3 text-center font-medium">综合精准度</th><th class="px-5 py-3 text-center font-medium">更新时间</th><th class="px-5 py-3 text-center font-medium w-20">操作</th></tr></thead><tbody id="algorithmTable"></tbody></table></div>
      <div class="px-5 py-4 border-t border-borderLine flex items-center justify-between"><span id="pageSummary" class="text-xs text-textSub"></span><div id="pagination" class="flex gap-2"></div></div>
    </section>
  </main>
</div></div>
<script>
const algorithms=[
['ALG-20240401-001','动火作业识别','安全生产','v3.2.1',[92.34,93.18,91.72,92.68],'运行中','2026-08-18 10:30'],
['ALG-20240312-006','未佩戴安全帽识别','人员行为','v2.8.0',[95.41,94.86,96.02,95.37],'运行中','2026-08-18 09:16'],
['ALG-20240508-012','高处作业未系安全带','人员行为','v2.3.4',[91.28,90.74,92.16,91.05],'运行中','2026-08-17 16:42'],
['ALG-20240126-003','烟火识别','环境设施','v4.1.2',[94.63,93.88,94.11,95.02],'运行中','2026-08-17 14:20'],
['ALG-20240618-021','人员闯入危险区域','人员行为','v1.9.3',[89.72,90.18,88.96,89.43],'运行中','2026-08-16 11:05'],
['ALG-20240205-008','通道堵塞识别','环境设施','v2.1.0',[88.24,87.95,88.61,null],'运行中','2026-08-15 17:36'],
['ALG-20240702-025','人员倒地识别','人员行为','v1.5.2',[90.62,91.04,89.77,90.31],'运行中','2026-08-15 13:10'],
['ALG-20240521-016','违规跨越设备识别','安全生产','v1.6.0',[86.92,87.36,86.48,null],'已停用','2026-08-12 08:45'],
['ALG-20240328-010','抽烟行为识别','人员行为','v2.4.1',[87.64,88.12,87.31,86.95],'运行中','2026-08-11 15:24'],
['ALG-20240603-019','配电柜未关闭识别','环境设施','v1.3.5',[85.71,86.08,84.92,null],'运行中','2026-08-10 10:18'],
['ALG-20240416-014','打电话行为识别','人员行为','v2.0.3',[84.93,85.41,85.08,84.72],'运行中','2026-08-09 18:02'],
['ALG-20240719-029','违规堆物识别','环境设施','v1.1.0',[82.48,83.16,82.92,null],'调试中','2026-08-08 09:40']
].map(([code,name,type,version,values,status,updated])=>({code,name,type,version,values,status,updated}));
const average=values=>{const valid=values.filter(Number.isFinite);return valid.length?valid.reduce((sum,value)=>sum+value,0)/valid.length:null};
const pageSize=8;let currentPage=1;
function render(){const pages=Math.ceil(algorithms.length/pageSize),start=(currentPage-1)*pageSize,rows=algorithms.slice(start,start+pageSize);
document.getElementById('algorithmCount').textContent=algorithms.length;document.getElementById('listCount').textContent=`（共 ${algorithms.length} 种）`;
document.getElementById('algorithmTable').innerHTML=rows.map((item,index)=>{const precision=average(item.values);return `<tr class="table-row border-t border-borderLine first:border-t-0"><td class="px-5 py-4 text-center text-textSub">${start+index+1}</td><td class="px-5 py-4"><div class="font-medium">${item.name}</div><div class="text-[11px] text-textLight mt-1">${item.code}</div></td><td class="px-5 py-4 text-textSub">${item.type}</td><td class="px-5 py-4 text-center font-medium">${item.version}</td><td class="px-5 py-4 text-center"><span class="text-primary font-semibold text-sm">${precision===null?'--':precision.toFixed(2)+'%'}</span></td><td class="px-5 py-4 text-center text-textSub">${item.updated}</td><td class="px-5 py-4 text-center"><a class="text-primary hover:underline" href="算法精准度分析.html?algorithm=${encodeURIComponent(item.code)}">查看</a></td></tr>`}).join('');
document.getElementById('pageSummary').textContent=`第 ${start+1}-${Math.min(start+pageSize,algorithms.length)} 条，共 ${algorithms.length} 条`;document.getElementById('pagination').innerHTML=Array.from({length:pages},(_,i)=>`<button data-page="${i+1}" class="w-8 h-8 rounded-md text-xs border ${currentPage===i+1?'bg-primary border-primary text-white':'bg-white border-borderLine text-textSub hover:border-primary'}">${i+1}</button>`).join('');document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{currentPage=Number(button.dataset.page);render()})}render();
const importButton=document.getElementById('importAlgorithmButton'),importInput=document.getElementById('algorithmImportInput');
importButton.onclick=()=>importInput.click();
importInput.onchange=()=>{if(!importInput.files.length)return;const toast=document.createElement('div');toast.className='fixed top-20 right-6 z-50 bg-emerald-500 text-white px-4 py-2.5 rounded-lg shadow-lg text-sm';toast.innerHTML='<i class="fa fa-check-circle mr-2"></i>算法数据导入成功';document.body.appendChild(toast);setTimeout(()=>toast.remove(),2000);importInput.value=''};
</script>
<script src="navigation.js?v=20260819-2"></script>
</body></html>
