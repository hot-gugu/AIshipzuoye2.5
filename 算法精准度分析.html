<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI智能分析 / 算法精准度详情</title>
  <script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#2563EB',pageBg:'#F8FAFC',borderLine:'#E2E8F0',textMain:'#1E293B',textSub:'#64748B',textLight:'#94A3B8'}}}};</script>
  <style type="text/tailwindcss">@layer utilities{.scrollbar-thin::-webkit-scrollbar{width:4px}.scrollbar-thin::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}.range-button.active{background:#EFF6FF;border-color:#2563EB;color:#2563EB;font-weight:500}}</style>
</head>
<body class="bg-pageBg h-screen overflow-hidden text-textMain">
<div class="flex h-full"><aside></aside><div class="flex flex-col overflow-hidden w-[calc(100%-240px)] ml-[240px]">
  <header class="h-14 bg-white border-b border-borderLine flex items-center justify-between px-5 shrink-0">
    <div class="flex items-center gap-4"><a href="算法精准度分析列表.html" class="w-8 h-8 rounded-md border border-borderLine flex items-center justify-center text-textSub hover:text-primary hover:border-primary" aria-label="返回算法列表"><i class="fa fa-angle-left text-lg"></i></a><div class="text-sm"><span class="text-textSub">AI智能分析</span><span class="mx-2 text-textLight">/</span><a href="算法精准度分析列表.html" class="text-textSub hover:text-primary">算法精准度分析</a><span class="mx-2 text-textLight">/</span><span class="font-medium">算法详情</span></div></div>
    <div class="flex items-center gap-5"><button class="relative text-textSub"><i class="fa fa-bell-o text-lg"></i><span class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">11</span></button><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center text-sm">张</div><div class="text-sm"><div class="font-medium">张安全</div><div class="text-[11px] text-textSub">安全环保部·管理员</div></div></div></div>
  </header>
  <main class="flex-1 overflow-y-auto scrollbar-thin p-5">
    <section class="bg-white border border-borderLine rounded-xl p-5 mb-4"><div class="flex items-start justify-between gap-6">
      <div class="flex gap-4"><div class="w-14 h-14 rounded-xl bg-blue-50 text-primary flex items-center justify-center shrink-0"><i class="fa fa-cube text-2xl"></i></div><div><div class="flex items-center gap-2"><h1 id="algorithmName" class="text-lg font-semibold"></h1><span id="algorithmStatus" class="px-2 py-0.5 rounded-full text-[11px]"></span></div><div class="mt-2 flex flex-wrap gap-x-6 gap-y-1 text-xs text-textSub"><span>算法编码：<b id="algorithmCode" class="text-textMain font-medium"></b></span><span>算法类型：<b id="algorithmType" class="text-textMain font-medium"></b></span><span>当前版本：<b id="algorithmVersion" class="text-textMain font-medium"></b></span><span>更新时间：<b id="algorithmUpdated" class="text-textMain font-medium"></b></span></div></div></div>
      <div class="min-w-[220px] rounded-xl bg-blue-50 border border-blue-100 p-4"><div class="text-xs text-textSub">综合精准度</div><div id="currentPrecision" class="text-3xl font-bold text-primary mt-1"></div></div>
    </div></section>
    <section class="bg-white border border-borderLine rounded-xl p-5 mb-4">
      <div class="flex items-center justify-between mb-4"><div><h2 class="font-medium text-sm">精准度提升趋势</h2><p class="text-[11px] text-textSub mt-1">展示综合精准度随算法训练与版本升级的变化。</p></div><div class="flex items-center gap-2"><button class="range-button px-3 py-1.5 text-xs rounded-md border border-borderLine text-textSub" data-range="7">近7天</button><button class="range-button active px-3 py-1.5 text-xs rounded-md border border-borderLine text-textSub" data-range="30">近30天</button><button class="range-button px-3 py-1.5 text-xs rounded-md border border-borderLine text-textSub" data-range="90">近90天</button><button class="range-button px-3 py-1.5 text-xs rounded-md border border-borderLine text-textSub" data-range="custom">自定义</button><div id="customDates" class="hidden items-center gap-2 ml-1"><input id="startDate" type="date" class="border border-borderLine rounded-md px-2 py-1 text-xs"><span class="text-textLight">~</span><input id="endDate" type="date" class="border border-borderLine rounded-md px-2 py-1 text-xs"><button id="applyCustom" class="px-3 py-1.5 rounded-md bg-primary text-white text-xs">确定</button></div></div></div>
      <div id="precisionChart" class="w-full h-[320px]"></div>
    </section>
    <section class="bg-white border border-borderLine rounded-xl overflow-hidden"><div class="px-5 py-4 border-b border-borderLine"><h2 class="font-medium text-sm">训练记录</h2></div><div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50 text-textSub"><tr><th class="px-4 py-3 text-left font-medium">训练时间</th><th class="px-4 py-3 text-left font-medium">版本</th><th class="px-4 py-3 text-center font-medium">正样本</th><th class="px-4 py-3 text-center font-medium">负样本</th><th class="px-4 py-3 text-center font-medium">精准度</th><th class="px-4 py-3 text-center font-medium">提升幅度</th></tr></thead><tbody id="trainingTable"></tbody></table></div></section>
  </main>
</div></div>
<script>
const baseAlgorithms=[
['ALG-20240401-001','动火作业识别','安全生产','v3.2.1',[92.34,93.18,91.72,92.68],'运行中','2026-08-18 10:30'],['ALG-20240312-006','未佩戴安全帽识别','人员行为','v2.8.0',[95.41,94.86,96.02,95.37],'运行中','2026-08-18 09:16'],['ALG-20240508-012','高处作业未系安全带','人员行为','v2.3.4',[91.28,90.74,92.16,91.05],'运行中','2026-08-17 16:42'],['ALG-20240126-003','烟火识别','环境设施','v4.1.2',[94.63,93.88,94.11,95.02],'运行中','2026-08-17 14:20'],['ALG-20240618-021','人员闯入危险区域','人员行为','v1.9.3',[89.72,90.18,88.96,89.43],'运行中','2026-08-16 11:05'],['ALG-20240205-008','通道堵塞识别','环境设施','v2.1.0',[88.24,87.95,88.61,null],'运行中','2026-08-15 17:36'],['ALG-20240702-025','人员倒地识别','人员行为','v1.5.2',[90.62,91.04,89.77,90.31],'运行中','2026-08-15 13:10'],['ALG-20240521-016','违规跨越设备识别','安全生产','v1.6.0',[86.92,87.36,86.48,null],'已停用','2026-08-12 08:45'],['ALG-20240328-010','抽烟行为识别','人员行为','v2.4.1',[87.64,88.12,87.31,86.95],'运行中','2026-08-11 15:24'],['ALG-20240603-019','配电柜未关闭识别','环境设施','v1.3.5',[85.71,86.08,84.92,null],'运行中','2026-08-10 10:18'],['ALG-20240416-014','打电话行为识别','人员行为','v2.0.3',[84.93,85.41,85.08,84.72],'运行中','2026-08-09 18:02'],['ALG-20240719-029','违规堆物识别','环境设施','v1.1.0',[82.48,83.16,82.92,null],'调试中','2026-08-08 09:40']
].map(([code,name,type,version,values,status,updated],index)=>({code,name,type,version,values,status,updated,index}));
const average=values=>{const valid=values.filter(Number.isFinite);return valid.reduce((sum,value)=>sum+value,0)/valid.length};
const requested=new URLSearchParams(location.search).get('algorithm'),algorithm=baseAlgorithms.find(item=>item.code===requested)||baseAlgorithms[0],precision=average(algorithm.values),statusClass=algorithm.status==='运行中'?'bg-emerald-50 text-emerald-600':algorithm.status==='调试中'?'bg-amber-50 text-amber-600':'bg-slate-100 text-slate-500';
document.getElementById('algorithmName').textContent=algorithm.name;document.getElementById('algorithmCode').textContent=algorithm.code;document.getElementById('algorithmType').textContent=algorithm.type;document.getElementById('algorithmVersion').textContent=algorithm.version;document.getElementById('algorithmUpdated').textContent=algorithm.updated;document.getElementById('algorithmStatus').textContent=algorithm.status;document.getElementById('algorithmStatus').className+=` ${statusClass}`;document.getElementById('currentPrecision').textContent=precision.toFixed(2)+'%';
const versionRoot=algorithm.version.split('.').slice(0,2).join('.');const training=Array.from({length:6},(_,i)=>{const current=precision-(5-i)*(1.25+(algorithm.index%3)*.18);return{date:`2026-${String(3+i).padStart(2,'0')}-${String(8+i*2).padStart(2,'0')} 02:00`,version:`${versionRoot}.${i}`,positive:1180+i*185+algorithm.index*17,negative:760+i*126+algorithm.index*11,precision:current,gain:i?1.25+(algorithm.index%3)*.18:0}});training[5].version=algorithm.version;training[5].precision=precision;
document.getElementById('trainingTable').innerHTML=training.slice().reverse().map(row=>`<tr class="border-t border-borderLine hover:bg-slate-50"><td class="px-4 py-3 text-textSub">${row.date}</td><td class="px-4 py-3 font-medium">${row.version}</td><td class="px-4 py-3 text-center text-textSub">${row.positive.toLocaleString()}</td><td class="px-4 py-3 text-center text-textSub">${row.negative.toLocaleString()}</td><td class="px-4 py-3 text-center text-primary font-medium">${row.precision.toFixed(2)}%</td><td class="px-4 py-3 text-center text-emerald-600">${row.gain?`↑ ${row.gain.toFixed(2)}%`:'--'}</td></tr>`).join('');
const chart=echarts.init(document.getElementById('precisionChart'));function makeTrend(days){const count=days===7?7:days===30?10:12;return Array.from({length:count},(_,i)=>{const date=new Date(2026,7,18-Math.round((count-1-i)*days/(count-1))),progress=i/(count-1);return{date:`${date.getMonth()+1}/${date.getDate()}`,value:Number((precision-7.2+progress*7.2+Math.sin(i*1.7)*.38).toFixed(2))}})}
function renderChart(days=30){const data=makeTrend(days);chart.setOption({tooltip:{trigger:'axis',valueFormatter:value=>value+'%'},grid:{left:45,right:24,top:24,bottom:36},xAxis:{type:'category',boundaryGap:false,data:data.map(item=>item.date),axisLine:{lineStyle:{color:'#E2E8F0'}},axisLabel:{color:'#64748B'}},yAxis:{type:'value',min:value=>Math.floor(value.min-2),max:100,axisLabel:{formatter:'{value}%',color:'#64748B'},splitLine:{lineStyle:{color:'#E2E8F0',type:'dashed'}}},series:[{name:'精准度',type:'line',smooth:true,data:data.map(item=>item.value),symbol:'circle',symbolSize:7,lineStyle:{color:'#2563EB',width:3},itemStyle:{color:'#2563EB',borderColor:'#fff',borderWidth:2},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(37,99,235,.22)'},{offset:1,color:'rgba(37,99,235,.02)'}]}}}]})}renderChart(30);
document.querySelectorAll('.range-button').forEach(button=>button.onclick=()=>{document.querySelectorAll('.range-button').forEach(item=>item.classList.remove('active'));button.classList.add('active');const custom=button.dataset.range==='custom';document.getElementById('customDates').className=custom?'flex items-center gap-2 ml-1':'hidden items-center gap-2 ml-1';if(!custom)renderChart(Number(button.dataset.range))});document.getElementById('applyCustom').onclick=()=>{const start=document.getElementById('startDate').value,end=document.getElementById('endDate').value;if(!start||!end)return;const days=Math.max(7,Math.round((new Date(end)-new Date(start))/86400000));renderChart(days)};window.addEventListener('resize',()=>chart.resize());
</script>
<script src="navigation.js?v=20260819-2"></script>
</body></html>
